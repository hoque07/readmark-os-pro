databases:
  - name: readmark-db
    plan: free
    databaseName: readmark
    user: readmark

services:
  - type: web
    name: readmark-os
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: readmark-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Tanvir
      - key: SEED_DEMO_DATA
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_DIST
        value: ../frontend/dist
